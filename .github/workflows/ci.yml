name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality:
        name: Lint & Build
        runs-on: ubuntu-latest

        env:
            WEB_URL: http://localhost:3000
            # Мусить відрізнятися хостом від WEB_URL (у dev — портом, у проді —
            # піддоменом): whitelist публічної зони походить саме звідси, і
            # `shared/config/env.ts` падає, якщо два origin-и збігаються.
            PAY_PUBLIC_URL: http://localhost:3001
            R2_PUBLIC_URL: https://media.finly.com.ua

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: corepack enable

            - uses: actions/cache@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-

            - run: pnpm install --frozen-lockfile

            - run: pnpm lint

            - run: pnpm build

    test:
        name: Tests
        runs-on: ubuntu-latest

        env:
            MONGODB_URI: mongodb://localhost:27017/finly-test

        services:
            mongodb:
                image: mongo:7
                ports:
                    - 27017:27017

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: corepack enable

            - uses: actions/cache@v4
              with:
                  path: ~/.local/share/pnpm/store
                  key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: pnpm-

            - run: pnpm install --frozen-lockfile

            - run: pnpm test
