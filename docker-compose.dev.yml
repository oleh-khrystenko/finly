services:
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data_dev:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5

    api:
        image: node:20-alpine
        working_dir: /app
        command: >
            sh -c "corepack enable &&
            pnpm install --frozen-lockfile
            --filter ./apps/api...
            --filter ./packages/types... &&
            pnpm --filter ./packages/types build &&
            pnpm --filter ./apps/api dev"
        environment:
            - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            - PNPM_STORE_DIR=/pnpm-store
            - CI=true
            - NODE_ENV=development
            - PORT=${API_PORT}
            - MONGODB_URI=${MONGODB_URI}
            - REDIS_URL=redis://redis:6379
            - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            # Sprint 30 — dev-хости: той самий `localhost`, різні порти
            # (кабінет WEB_PORT, pay-зона PAY_PORT). Вигаданий домен на кшталт
            # `finly.local` тут не годиться — Google OAuth не приймає
            # redirect-адресу на неіснуючому TLD. Cookie-scope портами не
            # розділяється, тож спільна сесія працює як у проді.
            #
            # `:?` (mandatory variable) — не косметика: без нього compose
            # підставив би порожній рядок, `PAY_PUBLIC_URL` став би
            # `http://localhost:` (валідна адреса на 80-му порту!), fail-fast
            # на старті API пропустив би це, а pay-зона тихо не працювала б —
            # QR-коди і copy-link вели б у нікуди.
            - WEB_URL=http://localhost:${WEB_PORT}
            - PAY_PUBLIC_URL=http://localhost:${PAY_PORT:?PAY_PORT is required - dev pay-zone port, see .env.example}
            - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN}
            - REVALIDATE_SECRET=${REVALIDATE_SECRET}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
            - RESEND_API_KEY=${RESEND_API_KEY}
            - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
            - MONOBANK_TOKEN=${MONOBANK_TOKEN}
            - BILLING_DEMO_MODE=${BILLING_DEMO_MODE}
            - BILLING_DUNNING_MAX_ATTEMPTS=${BILLING_DUNNING_MAX_ATTEMPTS}
            - BILLING_DUNNING_RETRY_INTERVAL_HOURS=${BILLING_DUNNING_RETRY_INTERVAL_HOURS}
            - BILLING_BRAND_PRICE_PER_BUSINESS=${BILLING_BRAND_PRICE_PER_BUSINESS}
            - BILLING_DOC_TIERS=${BILLING_DOC_TIERS}
            - BILLING_DOC_STORAGE_GB_PER_BUSINESS=${BILLING_DOC_STORAGE_GB_PER_BUSINESS}
            - BILLING_DOC_STORAGE_RENT_CREDITS_PER_GB=${BILLING_DOC_STORAGE_RENT_CREDITS_PER_GB}
            - BILLING_DOC_CREDIT_PACKS=${BILLING_DOC_CREDIT_PACKS}
            - BILLING_DOC_LOW_BALANCE_THRESHOLD=${BILLING_DOC_LOW_BALANCE_THRESHOLD}
            - BILLING_DOC_CRITICAL_BALANCE_THRESHOLD=${BILLING_DOC_CRITICAL_BALANCE_THRESHOLD}
            - BILLING_BRAND_ENABLED=${BILLING_BRAND_ENABLED}
            - BILLING_DOCUMENTS_ENABLED=${BILLING_DOCUMENTS_ENABLED}
            - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS}
            - AUTH_PASSWORD_MIN_LENGTH=${AUTH_PASSWORD_MIN_LENGTH}
            - AUTH_LOCKOUT_THRESHOLDS=${AUTH_LOCKOUT_THRESHOLDS}
            - AUTH_LOGIN_ATTEMPTS_TTL_MIN=${AUTH_LOGIN_ATTEMPTS_TTL_MIN}
            - AUTH_MAGIC_LINK_TTL_MIN=${AUTH_MAGIC_LINK_TTL_MIN}
            - AUTH_MAGIC_LINK_RATE_LIMIT=${AUTH_MAGIC_LINK_RATE_LIMIT}
            - AUTH_MAGIC_LINK_RATE_WINDOW_MIN=${AUTH_MAGIC_LINK_RATE_WINDOW_MIN}
            - AUTH_MAGIC_LINK_DEDUP_SEC=${AUTH_MAGIC_LINK_DEDUP_SEC}
            - ACCOUNT_DELETION_GRACE_DAYS=${ACCOUNT_DELETION_GRACE_DAYS}
            - ORPHAN_REMINDER_FIRST_DAYS=${ORPHAN_REMINDER_FIRST_DAYS}
            - ORPHAN_REMINDER_FINAL_DAYS=${ORPHAN_REMINDER_FINAL_DAYS}
            - ORPHAN_CLEANUP_DELETION_DAYS=${ORPHAN_CLEANUP_DELETION_DAYS}
            - BRAND_PENDING_CLEANUP_DAYS=${BRAND_PENDING_CLEANUP_DAYS}
            - BRAND_DEMOTED_CLEANUP_DAYS=${BRAND_DEMOTED_CLEANUP_DAYS}
            - GSC_SITE_URL=${GSC_SITE_URL}
            - GSC_CLIENT_EMAIL=${GSC_CLIENT_EMAIL}
            - GSC_PRIVATE_KEY=${GSC_PRIVATE_KEY}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            - HELP_CHAT_MAX_TOKENS=${HELP_CHAT_MAX_TOKENS}
            - HELP_CHAT_IP_LIMIT=${HELP_CHAT_IP_LIMIT}
            - HELP_CHAT_DAILY_BUDGET=${HELP_CHAT_DAILY_BUDGET}
            - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            - R2_BUCKET_NAME=${R2_BUCKET_NAME}
            - R2_PUBLIC_URL=${R2_PUBLIC_URL}
            - TSC_WATCHFILE=UsePolling
            - TSC_WATCHDIRECTORY=UsePolling
        ports:
            - '${API_PORT}:${API_PORT}'
        # Sprint 4 §4.0 — `host.docker.internal` alias для Linux у Режимі C
        # (API у dev compose, Mongo на host-machine з replica-set). На macOS/
        # Windows alias built-in у Docker Desktop і `host-gateway` — безпечний
        # noop. Без цього alias `MONGODB_URI=mongodb://host.docker.internal:...`
        # не резолвиться з api-контейнера на Linux і cascade-delete-флоу падає
        # з MongoServerSelectionError. Production-deploy ігнорує цей блок.
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - ./:/app
            - pnpm-store:/pnpm-store
            - /app/node_modules
        # `start_period` покриває холодний старт (pnpm install + build types +
        # nest bootstrap) — невдалі проби в цьому вікні не рахуються як фейл.
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q --spider http://127.0.0.1:${API_PORT}/api/health',
                ]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 300s
        depends_on:
            redis:
                condition: service_healthy

    web:
        image: node:20-alpine
        working_dir: /app
        command: >
            sh -c "corepack enable &&
            pnpm install --frozen-lockfile
            --filter ./apps/web...
            --filter ./packages/types... &&
            pnpm --filter ./packages/types build &&
            pnpm --filter ./apps/web dev"
        environment:
            - CI=true
            - NODE_ENV=development
            - NEXT_TELEMETRY_DISABLED=1
            - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            - PNPM_STORE_DIR=/pnpm-store
            - PORT=${WEB_PORT}
            - API_INTERNAL_URL=http://api:${API_PORT}
            - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
            # Sprint 30 — API йде через rewrite web-контейнера (`/api`), а не
            # прямою адресою: інакше запити з pay-хоста були б міждоменними, і
            # спільна сесія в dev вимагала б CORS-дозволу на публічну зону.
            # Прод працює саме так; dev мусить збігатися.
            - NEXT_PUBLIC_API_URL=/api
            - NEXT_PUBLIC_BILLING_DEMO_MODE=${NEXT_PUBLIC_BILLING_DEMO_MODE}
            - NEXT_PUBLIC_PAY_PUBLIC_URL=http://localhost:${PAY_PORT:?PAY_PORT is required - dev pay-zone port, see .env.example}
            - NEXT_PUBLIC_STORAGE_HOSTNAME=${NEXT_PUBLIC_STORAGE_HOSTNAME}
            - REVALIDATE_SECRET=${REVALIDATE_SECRET}
            - WATCHPACK_POLLING=true
            - CHOKIDAR_USEPOLLING=true
        ports:
            - '${WEB_PORT}:${WEB_PORT}'
            # Той самий контейнер під другим портом — публічна pay-зона.
            # Next.js бачить `Host: localhost:${PAY_PORT}`, і `proxy.ts`
            # розпізнає його як public host: whitelist
            # (`apps/web/src/shared/config/publicHosts.ts`) походить від
            # `NEXT_PUBLIC_PAY_PUBLIC_URL`, тобто від цього ж PAY_PORT — саме
            # тому порт не потрібно дублювати у коді.
            - '${PAY_PORT:?PAY_PORT is required - dev pay-zone port, see .env.example}:${WEB_PORT}'
        volumes:
            - ./:/app
            - pnpm-store:/pnpm-store
            - /app/node_modules
        # Next.js dev піднімається за секунди, api — за хвилини (install + build
        # types + nest watch). Без `service_healthy` браузер встигає викликати
        # `/api/auth/refresh`, rewrite летить у мертвий контейнер (ECONNREFUSED)
        # і користувача викидає на логін.
        depends_on:
            api:
                condition: service_healthy

volumes:
    redis_data_dev:
    pnpm-store:
