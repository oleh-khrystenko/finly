services:
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        networks:
            - internal

    api:
        build:
            context: .
            dockerfile: ./apps/api/Dockerfile
        restart: unless-stopped
        environment:
            - NODE_ENV=${NODE_ENV}
            - API_PORT=${API_PORT}
            - MONGODB_URI=${MONGODB_URI}
            - REDIS_URL=redis://redis:6379
            - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            - WEB_URL=${WEB_URL}
            - PAY_PUBLIC_URL=${PAY_PUBLIC_URL}
            - REVALIDATE_SECRET=${REVALIDATE_SECRET}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            - RESEND_API_KEY=${RESEND_API_KEY}
            - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
            - MONOBANK_TOKEN=${MONOBANK_TOKEN}
            - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS}
            - GSC_SITE_URL=${GSC_SITE_URL}
            - GSC_CLIENT_EMAIL=${GSC_CLIENT_EMAIL}
            - GSC_PRIVATE_KEY=${GSC_PRIVATE_KEY}
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
            - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            - R2_BUCKET_NAME=${R2_BUCKET_NAME}
            - R2_PUBLIC_URL=${R2_PUBLIC_URL}
        depends_on:
            - redis
        networks:
            - internal

    # One-shot service для DB-міграцій. Активується через
    # `docker compose --profile migrations run --rm api-migrations` у CI
    # (deploy.yml) перед `docker compose up -d`. Поза profile `migrations`
    # service не стартує разом з API/Web — тому регулярний `up` не тригерить
    # re-run. Env набір — той самий, що в `api`, але вирізаний до того, що
    # реально треба міграціям (Mongo only). Ділить network з `api`/`redis`,
    # бо MongoDB Atlas-URI йде назовні; redis dependency не потрібен.
    api-migrations:
        profiles: [migrations]
        build:
            context: .
            dockerfile: ./apps/api/Dockerfile
            target: migrations
        environment:
            - NODE_ENV=${NODE_ENV}
            - MONGODB_URI=${MONGODB_URI}
        networks:
            - internal

    web:
        build:
            context: .
            dockerfile: ./apps/web/Dockerfile
            args:
                API_INTERNAL_URL: http://api:${API_PORT}
                WEB_URL: ${WEB_URL}
                PAY_PUBLIC_URL: ${PAY_PUBLIC_URL}
                R2_PUBLIC_URL: ${R2_PUBLIC_URL}
        restart: unless-stopped
        environment:
            - NODE_ENV=${NODE_ENV}
            - PORT=${WEB_PORT}
            - API_INTERNAL_URL=http://api:${API_PORT}
            - WEB_URL=${WEB_URL}
            - PAY_PUBLIC_URL=${PAY_PUBLIC_URL}
            - R2_PUBLIC_URL=${R2_PUBLIC_URL}
            - REVALIDATE_SECRET=${REVALIDATE_SECRET}
        ports:
            - '127.0.0.1:${WEB_PORT}:${WEB_PORT}'
        depends_on:
            - api
        networks:
            - internal

networks:
    internal:
        driver: bridge

volumes:
    redis_data:
